<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHŌRA - Customizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="bg.css">
    <style>
        :root {
            --text-dark: #1a1a1a;
            --text-light: #666666;
            --bg-color: #fdfbf7;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            margin: 0;
        }

        /* Nav */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-dark);
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Layout */
        .customizer-container {
            display: flex;
            min-height: calc(100vh - 100px);
            padding: 0 4rem 4rem;
            gap: 4rem;
            position: relative;
            z-index: 1;
        }

        .controls-pane {
            flex: 1;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .preview-pane {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            overflow: hidden;
            position: relative;
        }

        /* Controls */
        .controls-pane h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .controls-pane p {
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dark);
            font-weight: 500;
        }

        select {
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--text-dark);
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload input[type="file"] {
            position: absolute;
            font-size: 100px;
            opacity: 0;
            right: 0;
            top: 0;
            cursor: pointer;
            height: 100%;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--text-dark);
            color: white;
            text-decoration: none;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            border: 1px solid var(--text-dark);
            cursor: pointer;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: #333;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-dark);
        }

        .btn-outline:hover {
            background-color: #f5f5f5;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        /* Preview Area */
        #mockup-container {
            position: relative;
            width: 100%;
            max-width: 600px; /* Base width for mockup */
            aspect-ratio: 3/4;
            background-color: #f9f9f9;
        }

        #mockup-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            pointer-events: none; /* Let events pass to canvas */
        }

        /* Overlay for dragging */
        #design-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Constrain design to product bounds ideally, simple overflow hidden for now */
        }

        .draggable-image {
            position: absolute;
            cursor: grab;
            max-width: 200px; /* Default size constraint */
            transform: translate(-50%, -50%);
            user-select: none;
            filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.2)); /* Slight shadow to see boundaries */
        }

        .draggable-image:active {
            cursor: grabbing;
        }

        /* Mobile */
        @media (max-width: 900px) {
            .customizer-container {
                flex-direction: column;
                padding: 0 1.5rem 2rem;
            }
            .controls-pane {
                max-width: 100%;
            }
            header {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div id="animated-background"></div>

    <header>
        <a href="index.html" class="logo">AHŌRA</a>
        <nav>
            <a href="index.html">← Back to Collection</a>
        </nav>
    </header>

    <div class="customizer-container">
        <div class="controls-pane">
            <div>
                <h1>Made by You</h1>
                <p>Upload your design and position it perfectly on your chosen product.</p>
            </div>

            <div class="form-group">
                <label for="product-select">Select Product</label>
                <select id="product-select">
                    <option value="shirt">Custom Shirt</option>
                    <option value="mug">Printed Mug</option>
                </select>
            </div>

            <div class="form-group">
                <label>Upload Design</label>
                <div class="file-upload">
                    <button class="btn btn-outline">Choose Image...</button>
                    <input type="file" id="design-upload" accept="image/png, image/jpeg">
                </div>
                <small style="color: var(--text-light); margin-top: 0.5rem; display:block;">PNG or JPG. Transparent backgrounds work best.</small>
            </div>

            <div class="action-buttons">
                <button class="btn" id="clear-btn" style="display: none;">Clear Design</button>
                <button class="btn" id="save-btn" style="display: none;">Looks Good</button>
            </div>
        </div>

        <div class="preview-pane">
            <div id="mockup-container">
                <!-- Using high-res unsplash images as blank mockups -->
                <img id="mockup-image" src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=800&auto=format&fit=crop" alt="Blank Mockup">

                <!-- Layer where the uploaded image will live and be dragged -->
                <div id="design-layer"></div>
            </div>
        </div>
    </div>

    <script src="bg.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const productSelect = document.getElementById('product-select');
            const mockupImage = document.getElementById('mockup-image');
            const designUpload = document.getElementById('design-upload');
            const designLayer = document.getElementById('design-layer');
            const clearBtn = document.getElementById('clear-btn');
            const saveBtn = document.getElementById('save-btn');

            // Product Mockup URLs
            const mockups = {
                shirt: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=800&auto=format&fit=crop", // Blank white tee
                mug: "https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?q=80&w=800&auto=format&fit=crop"   // Blank mug (using the same as collection for consistency, though ideally a blanker one)
            };

            // 1. Handle Product Change
            productSelect.addEventListener('change', (e) => {
                const product = e.target.value;
                mockupImage.src = mockups[product];
            });

            // Handle URL params to set initial product if navigated from home page
            const urlParams = new URLSearchParams(window.location.search);
            const initialProduct = urlParams.get('product');
            if(initialProduct && mockups[initialProduct]) {
                productSelect.value = initialProduct;
                mockupImage.src = mockups[initialProduct];
            }

            // State for dragging
            let currentDesignImg = null;
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            // 2. Handle Image Upload
            designUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    // Clear previous design
                    designLayer.innerHTML = '';

                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.className = 'draggable-image';

                    // Center initially
                    img.style.left = '50%';
                    img.style.top = '50%';

                    designLayer.appendChild(img);
                    currentDesignImg = img;

                    // Show buttons
                    clearBtn.style.display = 'block';
                    saveBtn.style.display = 'block';

                    setupDrag(img);
                };
                reader.readAsDataURL(file);
            });

            // 3. Clear Design
            clearBtn.addEventListener('click', () => {
                designLayer.innerHTML = '';
                designUpload.value = ''; // Reset input
                currentDesignImg = null;
                clearBtn.style.display = 'none';
                saveBtn.style.display = 'none';
            });

            // 4. Pure Vanilla JS Drag and Drop implementation
            function setupDrag(element) {
                element.addEventListener('mousedown', dragStart);
                element.addEventListener('touchstart', dragStart, {passive: false});

                function dragStart(e) {
                    if (e.type === 'touchstart') {
                        startX = e.touches[0].clientX;
                        startY = e.touches[0].clientY;
                    } else {
                        startX = e.clientX;
                        startY = e.clientY;
                    }

                    // Get current position in pixels. Since we use left/top 50% initially,
                    // we need computed style or offsetLeft/Top
                    initialLeft = element.offsetLeft;
                    initialTop = element.offsetTop;

                    isDragging = true;

                    document.addEventListener('mousemove', drag);
                    document.addEventListener('touchmove', drag, {passive: false});
                    document.addEventListener('mouseup', dragEnd);
                    document.addEventListener('touchend', dragEnd);
                }

                function drag(e) {
                    if (!isDragging) return;
                    e.preventDefault(); // Prevent scrolling on touch

                    let currentX, currentY;

                    if (e.type === 'touchmove') {
                        currentX = e.touches[0].clientX;
                        currentY = e.touches[0].clientY;
                    } else {
                        currentX = e.clientX;
                        currentY = e.clientY;
                    }

                    const dx = currentX - startX;
                    const dy = currentY - startY;

                    // Apply new position using pixel values rather than % for smooth dragging
                    element.style.left = `${initialLeft + dx}px`;
                    element.style.top = `${initialTop + dy}px`;
                }

                function dragEnd(e) {
                    isDragging = false;
                    document.removeEventListener('mousemove', drag);
                    document.removeEventListener('touchmove', drag);
                    document.removeEventListener('mouseup', dragEnd);
                    document.removeEventListener('touchend', dragEnd);
                }
            }
        });
    </script>
</body>
</html>
