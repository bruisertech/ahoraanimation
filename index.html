<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo Animado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white; /* Ensure base background is white */
            overflow-x: hidden;
            font-family: sans-serif;
        }

        #animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            background: white;
        }

        /* SVG Doodle Styles */
        .doodle {
            position: absolute;
            overflow: visible;
            width: 80px;
            height: 80px;
            /* Center the transformation */
            transform-origin: center center;
        }

        .doodle path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.5;

            /* Drawing animation setup */
            stroke-dasharray: var(--path-length, 1000);
            stroke-dashoffset: var(--path-length, 1000);

            /* Apply both animations */
            animation:
                draw var(--draw-duration, 3s) ease-out forwards,
                float var(--float-duration, 6s) ease-in-out infinite alternate;
            animation-delay: var(--draw-delay, 0s), var(--float-delay, 0s);
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes float {
            0% {
                transform: translate(0px, 0px) rotate(0deg);
            }
            100% {
                transform: translate(var(--float-x, 10px), var(--float-y, -20px)) rotate(var(--float-rot, 5deg));
            }
        }

        /* Scale down on smaller screens */
        @media (max-width: 768px) {
            .doodle {
                width: 50px;
                height: 50px;
            }
            .doodle path {
                stroke-width: 2;
            }
        }
    </style>
</head>
<body>

    <div id="animated-background"></div>

    <!-- Main content would go here -->
    <div style="padding: 2rem; z-index: 1;">
        <h1>Contenido Principal</h1>
        <p>Este es un texto de prueba sobre el fondo animado.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('animated-background');
            const totalDoodles = 50; // Total number of shapes to generate

            // 1. Imperfect Heart
            // 2. Curved Arrow
            // 3. Spiral
            // 4. Smiley Face (Eyes and mouth)
            // 5. Zigzag
            // 6. Freehand Circle
            // 7. Star
            const svgPaths = [
                // Heart
                "M 50,30 C 50,15 20,10 20,35 C 20,55 45,70 50,85 C 55,70 80,55 80,35 C 80,10 50,15 50,30 Z",
                // Arrow
                "M 20,80 Q 50,20 80,40 M 60,40 L 80,40 L 70,20",
                // Spiral
                "M 50,50 m 0,-5 a 5,5 0 1,0 0,10 a 10,10 0 1,0 0,-20 a 15,15 0 1,0 0,30 a 20,20 0 1,0 0,-40 a 25,25 0 1,0 0,50",
                // Smiley Face (Eyes and mouth as separate paths in one string, or combined)
                // We'll use multiple paths for smiley in a single SVG setup, but the code expects one path.
                // Let's adjust to allow an array of path strings for complex shapes.
                ["M 35,40 A 2,2 0 1,1 35.1,40", "M 65,40 A 2,2 0 1,1 65.1,40", "M 30,60 Q 50,80 70,60"],
                // Zigzag
                "M 15,30 L 30,70 L 45,30 L 60,70 L 75,30 L 90,70",
                // Freehand Circle
                "M 50,10 C 20,15 10,40 15,65 C 20,90 50,95 75,80 C 95,65 90,30 70,15 C 60,10 50,10 50,10",
                // Star
                "M 50,10 L 60,35 L 85,35 L 65,50 L 75,75 L 50,60 L 25,75 L 35,50 L 15,35 L 40,35 Z"
            ];

            const colors = [
                { stroke: '#333333', opacity: 0.3 }, // Grey
                { stroke: '#D4AF37', opacity: 1.0 }  // Gold
            ];

            // Helper to get random number
            const random = (min, max) => Math.random() * (max - min) + min;

            for (let i = 0; i < totalDoodles; i++) {
                const shapeData = svgPaths[Math.floor(Math.random() * svgPaths.length)];
                const paths = Array.isArray(shapeData) ? shapeData : [shapeData];

                const colorObj = colors[Math.floor(Math.random() * colors.length)];

                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.classList.add('doodle');
                svg.setAttribute('viewBox', '0 0 100 100');

                // Random positioning and base transformation
                const posX = random(0, 100);
                const posY = random(0, 100);
                const rot = random(0, 360);
                const scale = random(0.6, 1.2);

                svg.style.left = `${posX}vw`;
                svg.style.top = `${posY}vh`;
                svg.style.transform = `rotate(${rot}deg) scale(${scale})`;
                svg.style.opacity = colorObj.opacity;

                paths.forEach(d => {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute('d', d);
                    path.style.stroke = colorObj.stroke;

                    svg.appendChild(path);

                    // We need to calculate the path length AFTER adding to DOM or by creating a temp svg.
                    // It's easier if we just append and do it later, but we need variables set per path.
                    // Actually, setting variables on the path element itself via style works.
                });

                // Random animation variables
                const floatX = random(-30, 30);
                const floatY = random(-30, 30);
                const floatRot = random(-20, 20);

                const drawDuration = random(2, 4);
                const floatDuration = random(4, 8);
                const drawDelay = random(0, 2);
                const floatDelay = random(0, 3);

                svg.style.setProperty('--float-x', `${floatX}px`);
                svg.style.setProperty('--float-y', `${floatY}px`);
                svg.style.setProperty('--float-rot', `${floatRot}deg`);

                // Note: we'll apply animation vars to the paths
                container.appendChild(svg);

                // Calculate length and apply custom vars per path inside the SVG
                const svgPathsElements = svg.querySelectorAll('path');
                svgPathsElements.forEach(p => {
                    const length = p.getTotalLength();
                    p.style.setProperty('--path-length', length);
                    p.style.setProperty('--draw-duration', `${drawDuration}s`);
                    p.style.setProperty('--float-duration', `${floatDuration}s`);
                    p.style.setProperty('--draw-delay', `${drawDelay}s`);
                    p.style.setProperty('--float-delay', `${floatDelay}s`);
                });
            }
        });
    </script>
</body>
</html>
